<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .admin-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin: 20px -10px;
        }
        .admin-member {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 200px;
            margin: 10px;
            text-align: center;
            padding: 20px;
        }
        .admin-member img {
            width: 100%;
            height: auto;
            border-radius: 50%;
        }
        .admin-member h3 {
            margin: 10px 0 0;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <h1>Board of Governors</h1>
    <div class="admin-container">
        <div class="admin-member">
            <img src="placeholder.jpg" alt="Board Member 1">
            <h3>Board of Governors</h3>
        </div>
        <div class="admin-member">
            <img src="placeholder.jpg" alt="PTA">
            <h3>PTA</h3>
        </div>
        <div class="admin-member">
            <img src="placeholder.jpg" alt="Headteacher">
            <h3>Headteacher</h3>
        </div>
        <div class="admin-member">
            <img src="placeholder.jpg" alt="Deputy Headteacher">
            <h3>Deputy Headteacher</h3>
        </div>
        <div class="admin-member">
            <img src="placeholder.jpg" alt="Deputy Headteacher 2">
            <h3>Deputy Headteacher 2</h3>
        </div>
    </div>
</body>
</html>
