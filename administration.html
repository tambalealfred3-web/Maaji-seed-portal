<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Maaji Seed School</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .profile {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin: 10px;
            width: 200px;
            box-shadow: 2px 2px 12px #aaa;
        }
        img {
            width: 100%;
            border-radius: 8px;
        }
        .logo {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="Maaji Seed School Logo" class="logo">
        <h1>School Administration</h1>
    </header>
    <div class="container">
        <div class="profile">
            <img src="https://via.placeholder.com/150" alt="BoG">
            <h2>Board of Governors (BoG)</h2>
        </div>
        <div class="profile">
            <img src="https://via.placeholder.com/150" alt="PTA">
            <h2>Parent-Teacher Association (PTA)</h2>
        </div>
        <div class="profile">
            <img src="https://via.placeholder.com/150" alt="Headteacher">
            <h2>Headteacher</h2>
        </div>
        <div class="profile">
            <img src="https://via.placeholder.com/150" alt="Deputy Headteacher">
            <h2>Deputy Headteacher</h2>
        </div>
        <div class="profile">
            <img src="https://via.placeholder.com/150" alt="Deputy Headteacher 2">
            <h2>Deputy Headteacher 2</h2>
        </div>
    </div>
</body>
</html>
